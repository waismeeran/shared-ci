# Copy into a separate consumer repository. Replace OWNER and REVISION only
# after the Shared CI repository and candidate revision are published.
name: Shared CI hosted validation
run-name: 'Shared CI hosted validation: ${{ inputs.case }} (${{ inputs.working_directory }})'

on:
  workflow_dispatch:
    inputs:
      case:
        description: Case ID from fixtures/hosted-validation/cases.json
        required: true
        type: choice
        options:
          - npm-conventional
          - npm-node22
          - npm-node26
          - pnpm-conventional
          - yarn4-conventional
          - custom-overrides
          - nested-working-directory
          - e2e-enabled
          - invalid-config
          - capability-failure
          - npm-cache-invalidation-before
          - npm-cache-invalidation-after
      working_directory:
        description: Exact fixture directory from the selected case in cases.json
        required: true
        type: string
        default: fixtures/npm-full
      node_version:
        description: Node selector from the selected case (auto, 22, 24, or 26)
        required: false
        type: string
        default: '24'
      unit:
        description: Unit capability mode; use true for invalid-config
        required: false
        type: string
        default: auto
      e2e:
        description: Set true for e2e-enabled
        required: false
        type: string
        default: 'false'
      lint_command:
        description: Custom command for custom-overrides
        required: false
        type: string
      unit_command:
        description: Custom command for custom-overrides
        required: false
        type: string
      build_command:
        description: Custom command for custom-overrides
        required: false
        type: string

permissions:
  contents: read

jobs:
  shared-ci:
    uses: OWNER/shared-ci/.github/workflows/node-ci.yml@REVISION
    with:
      node-version: ${{ inputs.node_version }}
      working-directory: ${{ inputs.working_directory }}
      unit: ${{ inputs.unit || 'auto' }}
      e2e: ${{ inputs.e2e || 'false' }}
      lint-command: ${{ inputs.lint_command }}
      unit-command: ${{ inputs.unit_command }}
      build-command: ${{ inputs.build_command }}

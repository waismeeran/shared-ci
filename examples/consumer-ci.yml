# Adoption example for a consumer repository; OWNER/shared-ci is a placeholder.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: OWNER/shared-ci/.github/workflows/node-ci.yml@v1
    with:
      lint: 'true'
      unit: 'true'
      build: 'true'
